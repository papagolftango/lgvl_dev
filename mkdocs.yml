site_name: LVGL Dev – Living Docs
site_description: Firmware architecture, behavior specs, and BDD features rendered as living documentation.
repo_name: papagolftango/lgvl_dev
repo_url: https://github.com/papagolftango/lgvl_dev

theme:
  name: mkdocs

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - def_list
  - tables
  - fenced_code

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Testing & QA: testing.md
  - BDD Features: bdd/index.md
