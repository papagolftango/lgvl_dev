<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="black"/>
  <!-- Centered at (200,200), arc radius 180px for margin -->
  <g transform="translate(200,200)">
    <!-- 270 deg arc: from -135 deg to 135 deg, radius 180 -->
    <path d="M-127.28,127.28 A180,180 0 1,1 127.28,127.28" fill="none" stroke="white" stroke-width="16"/>
    <!-- Gauge markings -->
    <g stroke="white" stroke-width="4">
      <!-- -6 at -135 deg -->
      <line x1="-127.28" y1="127.28" x2="-108" y2="108" />
      <!-- -3 at -90 deg -->
      <line x1="-180" y1="0" x2="-153" y2="0" />
      <!-- 0 at top (0 deg) -->
      <line x1="0" y1="-180" x2="0" y2="-153" />
      <!-- 3 at 90 deg -->
      <line x1="180" y1="0" x2="153" y2="0" />
      <!-- 6 at 135 deg -->
      <line x1="127.28" y1="127.28" x2="108" y2="108" />
    </g>
  </g>
</svg>
